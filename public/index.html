<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS Personal Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="scan-line" aria-hidden="true"></div>

  <main class="jarvis-shell">
    <header class="top-bar panel glow-border">
      <div>
        <p class="eyebrow">Neural Control Interface</p>
        <h1>JARVIS Personal Dashboard</h1>
      </div>
      <div class="status-cluster">
        <div class="status-pill">
          <span class="dot"></span>
          <span id="systemState">System synchronized</span>
        </div>
        <div class="clock">
          <span id="dateStamp"></span>
          <strong id="timeStamp"></strong>
        </div>
      </div>
    </header>

    <section class="hud-grid" id="hudGrid">
      <article class="holo-panel panel glow-border" id="emailPanel">
        <header>
          <h2>Email Inbox</h2>
          <span class="refresh-tag" id="emailRefresh"></span>
        </header>
        <ul id="emailList" class="list"></ul>
      </article>

      <article class="holo-panel panel glow-border" id="jobsPanel">
        <header>
          <h2>LinkedIn Jobs</h2>
          <span class="refresh-tag" id="jobsRefresh"></span>
        </header>
        <ul id="jobsList" class="list"></ul>
      </article>

      <section class="core-stage" aria-label="Central AI core">
        <div class="core-hud ring outer"></div>
        <div class="core-hud ring middle"></div>
        <div class="core-hud ring inner"></div>
        <div class="core-pulse"></div>
        <div class="core-center">
          <p>AI CORE</p>
          <strong id="coreLoad">98.2%</strong>
          <small>Predictive runtime available</small>
        </div>
      </section>

      <article class="holo-panel panel glow-border" id="whatsPanel">
        <header>
          <h2>WhatsApp Alerts</h2>
          <span class="refresh-tag" id="whatsRefresh"></span>
        </header>
        <ul id="whatsList" class="list"></ul>
      </article>

      <article class="holo-panel panel glow-border" id="lifePanel">
        <header>
          <h2>Hourly Life Tracker</h2>
          <span class="refresh-tag" id="lifeRefresh"></span>
        </header>
        <div id="lifeMetrics" class="metric-grid"></div>
      </article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
